  "notes": "Public fork of igorlira/dirplayer-rs at reowens/dirplayer-rs (real GitHub fork lineage; click 'forked from igorlira/dirplayer-rs' on the repo page). The cokemusic branch holds the CokeMusic extraction harness on top of upstream main: get_cast_member_picture / load_movie / get_film_loop_frames MCP tools, native-build cfg gates, and five bitmap-dumper integration tests (dump_cct_bitmaps, dump_dcr_bitmaps, dump_engine_bitmaps, dump_studio_bitmaps, dump_furniture_bitmaps — the last emits JSON metadata only, no PNGs). All dumpers read CASTS_ROOT / OUTPUT_ROOT / ROOM_JSON_DIR / DCR_PATH from environment. Upstream main on the fork mirrors igorlira:main verbatim, untouched, so upstream sync stays trivial. The user-facing toolkit (Python extractors + docs + setup.sh) is the repo this lockfile ships in: reowens/cokemusic-extractor (public, v0.1.0 tagged 2026-05-03)."
